<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>נהורה+ | כל המושבים במקום אחד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap">
<style>
:root{--olive:#556B2F;--dark:#34452D;--cream:#F5F0E5;--card:#fff;--ink:#2b3324;--mut:#6d7561;--line:#e3dccb;--gold:#b09a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#F5F0E5}}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Heebo,Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:84px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.logo{display:block;width:min(430px,86%);margin:14px auto 6px;mix-blend-mode:multiply}
.chat{background:var(--olive);border-radius:20px;padding:14px;box-shadow:0 10px 28px rgba(52,69,45,.22);max-width:640px;margin:0 auto}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;margin-bottom:10px}
.msgs:empty{display:none}
.m{padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.5;max-width:88%}
.m.u{background:var(--cream);color:var(--dark);align-self:flex-start}
.m.b{background:rgba(255,255,255,.14);color:#fff;align-self:flex-end}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;border:0;border-radius:14px;padding:13px 15px;background:var(--cream);outline:none;font-size:16px}
.send{width:48px;border:0;border-radius:14px;background:var(--dark);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .15s,background .2s}
.send:hover{background:#26331f;transform:translateY(-1px)}.send:disabled{opacity:.5}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#fff;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-4px)}}
h2{font-size:20px;font-weight:700;color:var(--dark);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(52,69,45,.08);padding:14px 16px;border:1px solid var(--line)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ic{width:38px;height:38px;border-radius:11px;background:#e6ecd8;color:var(--olive);display:grid;place-items:center;flex:none}
.it{display:flex;gap:12px;align-items:center}.it b{font-size:15.5px}.it small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:9px 14px;background:var(--olive);color:#fff;font-weight:500;font-size:14px;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s}
.btn:hover{background:var(--dark);transform:translateY(-1px)}.btn.off{background:#cfd4c3;color:#6d7561;pointer-events:none}.btn.ghost{background:#e6ecd8;color:var(--dark)}
.empty{text-align:center;color:var(--mut);padding:18px;font-size:14.5px;line-height:1.6}
.fld{display:grid;gap:5px;margin-bottom:11px;font-size:14px;font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffdf8;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--olive)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13.5px;cursor:pointer}.chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.pg{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ok{background:#e6ecd8;color:var(--dark);border-radius:12px;padding:12px 14px;font-weight:500}
nav{position:fixed;inset:auto 0 0 0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;overflow-x:auto;justify-content:safe center;z-index:5}
nav button{flex:none;min-width:68px;border:0;background:none;border-radius:11px;padding:6px 8px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--mut);cursor:pointer;transition:.2s}
nav button.on{color:var(--olive);background:#e6ecd8;font-weight:700}
.hd{text-align:center;color:var(--mut);font-size:14px;margin:4px 0 14px}
.bd{margin-top:16px;max-width:640px;margin-inline:auto}.bdh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;color:var(--dark);font-size:16px}.bdh span{display:flex;gap:7px;align-items:center}
.ib{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--olive)}.ib:hover{background:#e6ecd8}
.bx{height:150px;overflow-y:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);display:grid;gap:8px;align-content:start}.bx::-webkit-scrollbar{display:none}
.ad{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start;width:100%;box-shadow:0 1px 6px rgba(52,69,45,.06);transition:box-shadow .2s,transform .2s}.ad:hover{box-shadow:0 4px 14px rgba(52,69,45,.14);transform:translateY(-1px)}
.ad img{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none}.ad b{font-size:14.5px;display:block}.ad p{font-size:13px;color:var(--mut);margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}.ad small{font-size:11.5px;color:var(--gold)}
.addbiz{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;padding:13px 15px;background:linear-gradient(135deg,var(--olive),var(--dark));color:#fff;font:inherit;text-align:start;cursor:pointer;box-shadow:0 4px 14px rgba(85,107,47,.28);transition:transform .15s,box-shadow .15s}.addbiz:hover{transform:translateY(-1px)}.addbiz:active{transform:scale(.98)}.addbiz b{display:block;font-size:15.5px}.addbiz small{opacity:.85;font-size:12.5px}.addbiz .pl{background:rgba(255,255,255,.18);border-radius:10px;padding:8px;display:grid;place-items:center}.err{background:#f7e3df;color:#8a2a1c;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:10px}.hrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov{position:fixed;inset:0;background:rgba(30,40,24,.5);display:grid;place-items:center;padding:18px;z-index:20;animation:in .25s both}.md{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:82vh;overflow:auto;padding:18px;position:relative}.md img{width:100%;border-radius:10px;margin:8px 0}
.pr{display:grid;max-width:640px;margin:14px auto 0}.ps{grid-area:1/1;opacity:0;transition:opacity .8s ease;pointer-events:none;background:linear-gradient(135deg,#fff,#eef1e2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative;text-align:start}.ps.on{opacity:1;pointer-events:auto}
.ps img{width:56px;height:56px;border-radius:10px;object-fit:cover}.ps b{font-size:15px;display:block}.ps p{font-size:13px;color:var(--mut)}.tag{font-size:10.5px;color:var(--mut);letter-spacing:.3px;display:block;margin-bottom:2px}
.pop{position:fixed;inset-inline-start:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100% - 24px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(52,69,45,.25);padding:12px 14px;z-index:15;animation:in .5s both;cursor:pointer}.pop .ib{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px}
.qn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:14px auto 0}
.qb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;background:#fbf8ef;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(52,69,45,.08);color:var(--dark);font-size:13px;font-weight:500;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.qb svg{color:var(--olive)}.qb:hover{background:#fff;transform:translateY(-2px);box-shadow:0 5px 14px rgba(52,69,45,.15)}.qb:active{transform:scale(.95);box-shadow:0 1px 4px rgba(52,69,45,.12)}
.qb{min-width:0;text-align:center;line-height:1.2}
@media(prefers-reduced-motion:reduce){.pg,.pop,.ov{animation:none}.ps{transition:none}.qb{transition:none}}
</style>
</head>
