<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ניהול נהורה+</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{--olive:#556B2F;--dark:#34452D;--cream:#F5F0E5;--line:#e3dccb;--mut:#6d7561;--soft:#e6ecd8;--bad:#a33a2c;--gold:#b09a55}
*{box-sizing:border-box;margin:0}
body{font-family:Heebo,Arial,sans-serif;background:var(--cream);color:#2b3324;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--dark);color:#f5f0e5;position:sticky;top:0;height:100vh;padding:16px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;z-index:30;transition:transform .25s}
.side h1{font-size:20px;font-weight:800;padding:4px 10px 14px;letter-spacing:.3px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:0;background:none;color:#e9e4d3;cursor:pointer;text-align:start;width:100%;transition:background .2s}
.nv:hover{background:rgba(255,255,255,.09)}.nv.on{background:var(--cream);color:var(--dark);font-weight:700}
.nv .bg{margin-inline-start:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;min-width:20px;text-align:center}
.side .sp{flex:1}
.main{flex:1;min-width:0;padding:22px 26px 70px;max-width:1100px}
.top{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:22px;font-weight:800;color:var(--dark);margin-inline-end:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(52,69,45,.07);padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}
.stat b{display:block;font-size:28px;color:var(--dark);font-weight:800}.stat span{color:var(--mut);font-size:13.5px;display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:8px 14px;background:var(--olive);color:#fff;font-weight:500;cursor:pointer;text-decoration:none;font-size:14px;transition:background .2s,transform .12s}
.btn:hover{background:var(--dark)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.g{background:var(--soft);color:var(--dark)}.btn.g:hover{background:#d8e1c4}.btn.d{background:#f3dcd8;color:var(--bad)}.btn.d:hover{background:#ecc9c3}
.ib{width:32px;height:32px;padding:0;justify-content:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
th{background:#faf7ee;color:var(--mut);font-weight:500;font-size:13px;white-space:nowrap}tr:last-child td{border-bottom:0}
td.ac{white-space:nowrap;text-align:end}td.ac .btn{margin-inline-start:4px}
.bdg{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;background:var(--soft);color:var(--dark)}.bdg.w{background:#f4ecd0;color:#7a6520}.bdg.b{background:#f3dcd8;color:var(--bad)}.bdg.m{background:#eee;color:#666}
.fld{display:grid;gap:4px;margin-bottom:11px;font-size:13.5px;font-weight:500}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fffdf8;outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(85,107,47,.15)}
.fld.ck{display:flex;align-items:center;gap:8px}.fld.ck input{width:auto}
.fld small{color:var(--mut);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(30,40,24,.5);display:grid;place-items:center;padding:16px;z-index:60;animation:fi .2s both}
.md{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px;animation:up .25s both}
.md h3{font-size:18px;color:var(--dark);margin-bottom:12px}.md .ft{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toasts{position:fixed;inset-inline-start:16px;bottom:16px;display:grid;gap:8px;z-index:90}
.toast{background:var(--dark);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 8px 22px rgba(0,0,0,.25);animation:up .25s both;max-width:340px}.toast.err{background:var(--bad)}
.err{background:#f3dcd8;color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:26px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}.pill.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:22px}.login h1{color:var(--dark);margin-bottom:4px}.login p{color:var(--mut);margin-bottom:14px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}.bars div{flex:1;background:var(--olive);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.img{display:flex;gap:10px;align-items:center}.img img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inq{margin-bottom:10px}.inq p{white-space:pre-wrap;margin:6px 0;line-height:1.6}
pre{background:#faf7ee;border-radius:10px;padding:10px;font-size:12px;overflow:auto;direction:ltr;text-align:left;max-height:240px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.mini div{background:#fbf8ef;border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;font-size:12px;color:var(--dark)}.mini div.hid{opacity:.35;text-decoration:line-through}
@media(max-width:860px){.side{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(100%)}.side.open{transform:none}.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--dark);color:#fff;padding:10px 14px;z-index:20}.main{padding:16px 14px 70px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  window.__globalCh=ch;
}
function teardown(){clearSubs();window.removeEventListener('hashchange',route);if(window.__globalCh){sb.removeChannel(window.__globalCh);window.__globalCh=null}session=null;document.title='ניהול נהורה+'}

/* ===== כניסה ===== */
let fails=0,lockUntil=0;
function renderLogin(msg){
  const em=h('input',{type:'email',autocomplete:'username',required:true,'data-k':'email'}),pw=h('input',{type:'password',autocomplete:'current-password',required:true,'data-k':'password'}),err=h('div',{class:'err',style:msg?null:'display:none'},msg||''),go=h('button',{class:'btn',style:'width:100%;justify-content:center'},'כניסה');
  const form=h('form',{class:'card',novalidate:true},h('label',{class:'fld'},h('span',{},'אימייל'),em),h('label',{class:'fld'},h('span',{},'סיסמה'),pw),err,go);
  form.addEventListener('submit',async e=>{
    e.preventDefault();const show=m=>{err.textContent=m;err.style.display=''};
    if(Date.now()<lockUntil)return show('יותר מדי ניסיונות. נסו שוב בעוד מספר שניות.');
    if(!em.value.trim()||!pw.value)return show('יש להזין אימייל וסיסמה');
    go.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    go.disabled=false;
    if(error||!data.session){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return show('פרטי ההתחברות שגויים')}
    fails=0;session=data.session;
    const ok=await verifyAdmin(session);if(!ok){session=null;return renderLogin('לחשבון זה אין הרשאת מנהל.')}
    renderShell(session.user);
  });
  app.replaceChildren(h('div',{class:'login'},h('h1',{},'ניהול נהורה+'),h('p',{},'כניסה למנהלי האתר בלבד'),form));
}
async function verifyAdmin(s){
  const {data}=await sb.from('admins').select('user_id').eq('user_id',s.user.id).maybeSingle();
  if(data)return true;await sb.auth.signOut();return false;
}
function renderSetup(){app.replaceChildren(h('div',{class:'login'},h('div',{class:'card'},h('h1',{},'נדרשת הגדרת חיבור'),h('p',{},'יש להזין בראש הקובץ (CFG) את כתובת פרויקט Supabase ואת המפתח הציבורי (anon). לא מזינים מפתח service_role.'))))}
async function boot(){
  if(!CFG.url||!CFG.key||!window.supabase)return renderSetup();
  sb=window.supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession();
  if(data&&data.session){session=data.session;if(await verifyAdmin(session))return renderShell(session.user);session=null;return renderLogin('לחשבון זה אין הרשאת מנהל.')}
  renderLogin();
}
boot();
})();
</script>
